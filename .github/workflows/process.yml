  name: Build XMIT and add to new release demo for FORGE26

  on:
    push:
      branches:
        - master

  permissions:
    contents: write

  jobs:
    release:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout
          uses: actions/checkout@v6
          with:
            fetch-depth: 0

        - name: Calculate next release number
          id: version
          run: |
            git fetch --tags

            latest_tag=$(git tag --list \
              | grep -E '^[0-9]+\.0$' \
              | sort -V \
              | tail -n 1 || true)

            if [ -z "$latest_tag" ]; then
              version="1.0"
            else
              major="${latest_tag%%.*}"
              version="$((major + 1)).0"
            fi

            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Next release: $version"

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.11"

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install xmi-reader

        - name: Generate XMIT
          run: |
            mkdir -p "$RUNNER_TEMP/TEXTS.PDS"
            python .github/scripts/generate_xmit.py "$RUNNER_TEMP/TEXTS.PDS"

        - name: Create Release
          uses: softprops/action-gh-release@v2
          with:
            tag_name: ${{ steps.version.outputs.version }}
            name: ${{ steps.version.outputs.version }}
            body_path: RELEASE.md
            files: PDS.XMIT
            target_commitish: ${{ github.sha }}
